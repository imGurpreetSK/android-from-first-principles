name: Challenge a claim
description: Show with a counter-source that a claim in a chapter is wrong, or that its cited doc page no longer supports it.
body:
  - type: input
    id: chapter
    attributes:
      label: Chapter
      description: Give the chapter slug or the chapter URL.
      placeholder: main-thread
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Claim
      description: Quote the claim.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Wrong at the baseline
        - Changed in a newer Android release
        - Doc page no longer supports the claim
    validations:
      required: true
  - type: input
    id: counter-source
    attributes:
      label: Counter-source
      description: "Give one URL. Code: a file and a line at a pinned ref, never a branch. On Gitiles, use `+/refs/tags/<tag>/` or a full 40-character SHA. On GitHub, use a full SHA or a tag. Do not use cs.android.com. Doc page: its URL, not an archive snapshot. Talk: its URL and a timestamp. If you challenge the output of a device prompt, write 'Device output'. Chapters describe AOSP behavior. The behavior of one OEM device does not show that a claim is wrong. Give AOSP code or the Compatibility Definition Document (CDD)."
    validations:
      required: true
  - type: textarea
    id: device-output
    attributes:
      label: Device output
      description: If you challenge the output of a device prompt, paste your output. Give the command, the emulator system image and its revision.
