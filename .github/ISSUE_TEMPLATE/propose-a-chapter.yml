name: Propose a chapter
description: Propose a new topic or a split of a chapter.
labels: [proposal]
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      description: If you propose a split, also give the chapter slug.
    validations:
      required: true
  - type: dropdown
    id: proposal
    attributes:
      label: Proposal
      options:
        - New topic
        - Split of a chapter
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: Question
      description: Give the question that the chapter answers.
      placeholder: How does a notification reach the status bar?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: "Give one to three sources that the chapter can cite: AOSP or library code, doc pages or talks."
  - type: checkboxes
    id: author
    attributes:
      label: Author
      options:
        - label: If the maintainer adds this chapter to the curriculum, I will write it.
