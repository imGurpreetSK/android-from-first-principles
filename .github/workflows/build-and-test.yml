name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a PR, HEAD is the merge commit of the PR, and HEAD^1 is the base. Depth 2 fetches both, for the source check below.
          fetch-depth: 2
      # setup-node reads the Node version from engines.node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/package.json
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      # Each GitHub source must point to a full SHA or a tag. The check runs git ls-remote --tags, so it needs the network, and astro build does not run it.
      - run: node scripts/github-tags.ts
      # On a PR, fetch each source of each docs file that the PR changes. If a source does not load, the job fails.
      # shell: bash runs bash -eo pipefail, so if git diff fails, the step fails. -z and -0 keep each file name whole.
      - if: github.event_name == 'pull_request'
        shell: bash
        run: git diff -z --name-only --relative HEAD^1 HEAD -- src/content/docs | xargs -0 node scripts/dead-sources.ts

  samples:
    # The ubuntu-24.04 image has the Android SDK, the platform and the build tools that samples/ needs. It also sets ANDROID_HOME.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # JDK 17 is the oldest JDK that samples/ supports. On JDK 17, RebuildConventionTest.compileKotlin_rejectsJdk21Api cannot fail, because JDK 17 has no JDK 21 API. JDK 21 is the oldest JDK on which that test can fail.
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          # The default cache key does not include samples/gradle/libs.versions.toml. That file has the plugin and library versions.
          cache-dependency-path: |
            samples/**/*.gradle*
            samples/**/gradle-wrapper.properties
            samples/gradle/libs.versions.toml
      - run: samples/gradlew -p samples build
