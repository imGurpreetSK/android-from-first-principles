name: Weekly source check

# Each week, fetch the sources of all chapters. If a source does not load, open an issue, or update the open issue. If all sources load, close the open issue.
# This workflow is not a PR check, so it does not block PRs. If a source does not load, the job still passes, because the issue tells the maintainer.
on:
  # In a public repository, GitHub disables this schedule after 60 days with no repository activity.
  # To enable it again, run: gh workflow enable weekly-source-check.yml
  schedule:
    # Each Monday at 06:17 UTC. GitHub can delay a scheduled run at the start of each hour.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# One run at a time. A second run waits, so it finds the issue that the first run opened.
concurrency:
  group: weekly-source-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sources:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-node reads the Node version from engines.node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/package.json
      - run: npm ci
      # GitHub-hosted runners have gh. gh reads the token from GH_TOKEN and the repo from GH_REPO.
      - run: node scripts/weekly-source-check.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
